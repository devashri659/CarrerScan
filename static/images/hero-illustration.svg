<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="100%" fill="none">
  <!-- Soft Backdrop / Ground shadow -->
  <ellipse cx="230" cy="272" rx="190" ry="14" fill="#E2E8F0" opacity="0.6"/>

  <!-- Laptop Base -->
  <rect x="70" y="246" width="320" height="14" rx="4" fill="#0B2347"/>
  <rect x="60" y="256" width="340" height="6" rx="3" fill="#1E3A63"/>
  <path d="M195 246 H265 V250 C265 252 263 254 261 254 H199 C197 254 195 252 195 250 Z" fill="#3B5377"/>

  <!-- Laptop Screen Outer Shell -->
  <rect x="95" y="44" width="270" height="204" rx="10" fill="#0B2347" stroke="#1E3A63" stroke-width="2"/>
  
  <!-- Web Camera -->
  <circle cx="230" cy="54" r="3" fill="#102B50"/>
  <circle cx="230" cy="54" r="1.5" fill="#38BDF8"/>

  <!-- Screen Glass / Workspace -->
  <rect x="107" y="64" width="246" height="174" rx="5" fill="#F8FAFC"/>

  <!-- Offer Document on Screen -->
  <g filter="drop-shadow(0px 3px 6px rgba(11,35,71,0.08))">
    <rect x="122" y="74" width="160" height="152" rx="6" fill="#FFFFFF" stroke="#D5DEEC" stroke-width="1"/>
    
    <!-- Document Header & Icon -->
    <rect x="134" y="86" width="28" height="6" rx="2" fill="#0866E8"/>
    <rect x="134" y="96" width="60" height="4" rx="1.5" fill="#58677D"/>
    
    <!-- Mini offer lines -->
    <rect x="134" y="108" width="134" height="3" rx="1" fill="#E2E8F0"/>
    <rect x="134" y="116" width="120" height="3" rx="1" fill="#E2E8F0"/>
    <rect x="134" y="124" width="130" height="3" rx="1" fill="#E2E8F0"/>
    
    <!-- Verified Badge / Checklist on document -->
    <g transform="translate(134, 136)">
      <circle cx="6" cy="6" r="5" fill="#E0F2FE"/>
      <path d="M4 6 L5.5 7.5 L8.5 4.5" stroke="#0866E8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="16" y="4" width="70" height="4" rx="1.5" fill="#94A3B8"/>
    </g>
    <g transform="translate(134, 150)">
      <circle cx="6" cy="6" r="5" fill="#DCFCE7"/>
      <path d="M4 6 L5.5 7.5 L8.5 4.5" stroke="#218653" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="16" y="4" width="60" height="4" rx="1.5" fill="#94A3B8"/>
    </g>

    <!-- Sign-off Stamp -->
    <rect x="134" y="180" width="46" height="12" rx="3" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="140" y="184" width="34" height="3" rx="1" fill="#0866E8"/>
  </g>

  <!-- Right Floating Security Shield with Magnifying Glass -->
  <g transform="translate(262, 90)" filter="drop-shadow(0px 8px 16px rgba(11,35,71,0.18))">
    <!-- Shield Container -->
    <path d="M45 4 C68 4 86 16 86 32 C86 64 54 94 45 102 C36 94 4 64 4 32 C4 16 22 4 45 4 Z" fill="#FFFFFF" stroke="#0866E8" stroke-width="3"/>
    
    <!-- Shield Inner Core -->
    <path d="M45 10 C63 10 78 20 78 33 C78 60 52 86 45 93 C38 86 12 60 12 33 C12 20 27 10 45 10 Z" fill="#F0F7FF"/>
    
    <!-- Magnifying Glass Inside Shield -->
    <circle cx="41" cy="43" r="16" fill="none" stroke="#0866E8" stroke-width="3.5"/>
    <path d="M53 55 L65 67" stroke="#0866E8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sparkle / Scan Check Accent -->
    <path d="M36 43 L40 47 L47 39" stroke="#218653" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
